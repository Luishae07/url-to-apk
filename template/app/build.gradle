plugins { id 'com.android.application' }

android {
    namespace 'app.webwrap'
    compileSdk 34

    defaultConfig {
        applicationId '__APPID__'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable straight away; not a Play Store signature
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
